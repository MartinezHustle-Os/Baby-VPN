name: Facebook & Instagram - 40min access windows
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baby-vpn-social-windows
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Facebook / Instagram rule policy
        run: python3 scripts/social_window.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
